apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-web
spec:
  selector:
    matchLabels:
      app: app-web
  template:
    metadata:
      labels:
        app: app-web
    spec:

      tolerations: #Cluster AWS - Tolerations para permitir que os pods sejam agendados em nós com a taint "dedicated=apps:NoSchedule"
      - key: "dedicated"
        operator: "Equal"
        value: "apps"
        effect: "NoSchedule"

      containers:
        - name: app-web
          image: danferreira011/app-pilot-node:v2
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: app-web
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing # loadbalancer publico
spec:
  selector:
    app: app-web
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
      name: http