name: CI-CD
on:
  # push:
  #   branches: ["main"]
  workflow_dispatch:
jobs:
  CI:
    runs-on: ubuntu-24.04
    steps:
    - name: Obtendo o Código
      uses: actions/checkout@v6.0.2
#autenticar no dokcerhub
#executar docker build
#executar docker push
    - name: Set up QEMU #para corrigir problemas de plataforma
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx #para corrigir problemas de plataforma
      uses: docker/setup-buildx-action@v3

    - name: Autenticação Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ vars.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build da imagem Docker (and Push)
      uses: docker/build-push-action@v7
      with:
        context: .
        file: Dockerfile
        push: true
        platforms: linux/amd64,linux/arm64 #para garantir que a imagem seja compatível com diferentes arquiteturas
        provenance: false #desabilitar a geração de metadados de proveniência, que pode causar problemas em alguns casos
        tags: |
          danferreira011/app-pilot-node:v${{github.run_number}}
          danferreira011/app-pilot-node:latest
  CD:
    runs-on: ubuntu-24.04
    needs: [CI]
    steps:
    - name: Obtendo o Código
      uses: actions/checkout@v6.0.2
      
    - name: Login Azure
      uses: azure/login@v1
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    - name: Configuração de contexto do K8S
      run: |
        az account set --subscription AZURE_SUBSCRIPTION_ID
        az aks get-credentials --resource-group rg-app-node --name aks-cluster --overwrite-existing
    - name: Execução do Manisfesto
      uses: Azure/k8s-deploy@v5
      with:        
        manifests: |
            ./k8s/deploy.yaml
        images: |
          danferreira011/app-pilot-node:v${{github.run_number}}
          danferreira011/app-pilot-node:latest
